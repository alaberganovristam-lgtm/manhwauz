name: Deploy ManhwaUZ

on:
  push:
    branches: [main]
  workflow_dispatch:  # Qo'lda ham ishga tushirish

jobs:
  # ── 1. Cloudflare Pages (asosiy sayt) ──────────────────────
  deploy-pages:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken:      ${{ secrets.CF_API_TOKEN }}
          accountId:     ${{ secrets.CF_ACCOUNT_ID }}
          projectName:   manhwauz
          directory:     web
          gitHubToken:   ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'

  # ── 2. Cloudflare Workers (API) ─────────────────────────────
  deploy-workers:
    name: Cloudflare Workers API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy Workers
        run: wrangler deploy
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  # ── 3. comics.json → KV (faqat o'zgarsa) ───────────────────
  sync-comics-data:
    name: Sync comics.json to KV
    runs-on: ubuntu-latest
    needs: deploy-workers
    if: |
      contains(join(github.event.head_commit.modified, ','), 'data/comics.json') ||
      contains(join(github.event.head_commit.added, ','), 'data/comics.json') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Upload comics.json to Cloudflare KV
        run: |
          npm install -g wrangler
          wrangler kv:key put \
            --namespace-id="${{ secrets.KV_NAMESPACE_ID }}" \
            "comics.json" \
            --path=data/comics.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  # ── 4. Bot server (Railway) ──────────────────────────────────
  deploy-bot:
    name: Bot Server (Railway)
    runs-on: ubuntu-latest
    if: |
      contains(join(github.event.head_commit.modified, ','), 'bot/') ||
      contains(join(github.event.head_commit.added, ','), 'bot/') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger Railway Redeploy
        run: |
          curl -sX POST "${{ secrets.RAILWAY_WEBHOOK_URL }}" \
               -H "Content-Type: application/json" || true

  # ── 5. Deploy natijasi ───────────────────────────────────────
  notify:
    name: Deploy natijasi
    runs-on: ubuntu-latest
    needs: [deploy-pages, deploy-workers]
    if: always()
    steps:
      - name: Send Telegram notification
        run: |
          STATUS="${{ needs.deploy-pages.result }}"
          if [ "$STATUS" = "success" ]; then
            MSG="✅ ManhwaUZ deploy muvaffaqiyatli!%0A🌐 https://manhwauz.com%0A📝 Commit: ${{ github.event.head_commit.message }}"
          else
            MSG="❌ ManhwaUZ deploy xato!%0A🔍 https://github.com/${{ github.repository }}/actions"
          fi
          curl -s "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
               -d "chat_id=${{ secrets.ADMIN_TELEGRAM_ID }}&text=${MSG}&parse_mode=Markdown" || true
