<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Yuklanmoqda... | Manhwa UZ</title>
<meta name="theme-color" content="#913FE2">
<link rel="stylesheet" href="/_astro/_slug_.CvPJ_jpT.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='16' fill='%23913FE2'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' fill='white' font-weight='800' font-size='13' font-family='sans-serif'>MU</text></svg>">
<meta name="referrer" content="no-referrer">
<style id="_fix-hero">
.hero-skeleton{opacity:0!important;pointer-events:none!important}
.embla-hero{opacity:1!important}
body{background:#13111A;color:#fff}
.user-menu-skeleton .user-menu-login{display:block}
.user-menu-skeleton .user-menu-avatar{display:none!important}
html.has-user .user-menu-skeleton .user-menu-login{display:none}
html.has-user .user-menu-skeleton .user-menu-avatar,html.has-user .notif-bell-skeleton{display:flex!important}
.asura-desktop-flex,.asura-desktop-block{display:none}
.asura-mobile-button{display:flex}.asura-mobile-layer{display:block}

/* Loading skeleton */
.mu-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:1rem;color:rgba(255,255,255,.5)}
.mu-spinner{width:40px;height:40px;border:3px solid rgba(145,63,226,.2);border-top-color:#913FE2;border-radius:50%;animation:spin .8s linear infinite}

.mu-error h2{font-size:3rem;color:#913FE2;margin-bottom:1rem}
</style>
<script>if(localStorage.getItem("user")){document.documentElement.classList.add("has-user")}</script>
</head>
<body class="min-h-screen bg-[#13111A] text-white">

<!-- Nav nav_template.html dan JS bilan yuklanadi -->
<div id="mu-nav"></div>

<main class="flex-1" id="mu-main">
  <div class="mu-loading">
    <div class="mu-spinner"></div>
    <span>Yuklanmoqda...</span>
  </div>
</main>

<div id="mu-footer"></div>

<script src="/_fix.js?v=1"></script>
<script type="module">
// ─────────────────────────────────────────────
// comic.html — comic-dynamic.php ning JS versiyasi
// URL: /comics/SLUG
// ─────────────────────────────────────────────

const API = window.MU_API || '';
const CDN = window.MU_CDN || '';

// URL dan slug olish
const slug = location.pathname.replace(/^\/comics\//, '').replace(/\/$/, '');
if (!slug) { location.href = '/'; }

function cdnImg(src) {
  if (!src) return '';
  if (src.startsWith('http')) return src;
  return CDN + src;
}

function hd(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtNum(n) {
  n = parseInt(n) || 0;
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return n;
}

function chUrl(sl, n) { return `/reader/${sl}/${n}`; }

// Nav va Footer ni nav_template.html dan yuklash
async function loadNavFooter() {
  try {
    const r = await fetch('/nav_template.html');
    const html = await r.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    const header = doc.querySelector('header');
    const footer = doc.querySelector('footer');
    const styles = doc.querySelectorAll('style');
    if (header) document.getElementById('mu-nav').innerHTML = header.outerHTML;
    if (footer) document.getElementById('mu-footer').innerHTML = footer.outerHTML;
    styles.forEach(s => document.head.appendChild(s.cloneNode(true)));
    // Branding fix
    document.querySelectorAll('img[alt="Asura Scans"]').forEach(img => img.alt = 'Manhwa UZ');
  } catch(e) {}
}

// Komiks ma'lumotlarini yuklash
async function loadComic() {
  let comic;
  try {
    const r = await fetch(`${API}/api/comics/${slug}`);
    if (!r.ok) throw new Error('not found');
    comic = await r.json();
  } catch(e) {
    document.getElementById('mu-main').innerHTML = `
      <div class="mu-error">
        <h2>404</h2>
        <p>Komiks topilmadi: <b>${hd(slug)}</b></p>
        <a href="/" style="color:#913FE2">← Bosh sahifa</a>
      </div>`;
    return;
  }

  const chapters = (comic.chapters || []).sort((a,b) => b.number - a.number);
  const firstCh  = chapters.length ? chapters[chapters.length-1] : null;
  const latestCh = chapters.length ? chapters[0] : null;
  const chTotal  = chapters.length;
  const cover    = cdnImg(comic.cover || '');
  const rating   = parseFloat(comic.rating) || 0;
  const bookmarks= parseInt(comic.ratingCount) || 0;
  const genres   = comic.genres || [];
  const statusLow= (comic.status || 'ongoing').toLowerCase();
  const typeLow  = (comic.type || 'manhwa').toLowerCase();

  document.title = `${comic.title} | Manhwa UZ`;
  document.querySelector('meta[name="description"]')?.setAttribute('content',
    (comic.description || '').replace(/<[^>]+>/g,'').slice(0, 160));

  document.getElementById('mu-main').innerHTML = `
<div class="relative">
  <!-- Background banner (desktop) -->
  <div class="hidden lg:block absolute top-0 left-0 w-full h-[450px] overflow-hidden -mt-19 -z-1">
    ${cover ? `<img src="${hd(cover)}" alt="${hd(comic.title)}" class="w-full h-full object-cover blur-[6px] scale-110 pointer-events-none select-none" draggable="false">` : ''}
    <div class="absolute inset-0 bg-black/50"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent via-40% to-[#0D0B0E]"></div>
  </div>

  <!-- Mobile cover section -->
  <div class="lg:hidden relative h-[300px] flex items-center justify-center pt-4">
    <div class="absolute inset-x-0 top-0 h-[500px] -z-10 overflow-hidden">
      ${cover ? `<img src="${hd(cover)}" alt="" aria-hidden="true" class="w-full h-full object-cover blur-[4px] scale-105 pointer-events-none select-none" draggable="false">` : ''}
      <div class="absolute inset-0 bg-black/50"></div>
      <div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent via-40% to-[#0D0B0E]"></div>
    </div>
    <div class="relative w-[180px] aspect-[2/3] rounded-lg overflow-hidden shadow-2xl" style="aspect-ratio:2/3">
      ${cover ? `<img src="${hd(cover)}" alt="${hd(comic.title)}" class="w-full h-full object-cover">` : ''}
    </div>
  </div>

  <!-- Content -->
  <div class="mx-auto w-full md:w-[95%] max-w-[1285px] px-3 lg:px-0 relative z-10 pt-0 lg:pt-8 mb-5 md:mb-7">
    <div class="lg:flex lg:gap-9">

      <!-- LEFT COLUMN -->
      <div class="lg:max-w-[400px] w-full flex flex-col gap-3 relative">
        <!-- Cover (desktop) -->
        <div class="hidden lg:block relative aspect-[2/3] rounded-lg overflow-hidden w-full" style="aspect-ratio:2/3">
          ${cover ? `<img src="${hd(cover)}" alt="${hd(comic.title)}" class="w-full h-full object-cover">` : ''}
        </div>

        <!-- Stats Card (desktop) -->
        <div class="hidden lg:block">
          <div class="bg-white/5 rounded-lg p-4">
            <div class="flex justify-around text-center mb-4">
              <div>
                <div class="flex items-center justify-center gap-1.5">
                  <svg class="w-5 h-5" viewBox="0 0 13 14" fill="none"><defs><linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFDA6E"/><stop offset="100%" stop-color="#FFC414"/></linearGradient></defs><path d="M5.67513 1.20359C6.07233 0.624015 6.92766 0.624014 7.32487 1.20359L8.94401 3.5661C9.07404 3.75583 9.2655 3.89493 9.48612 3.95997L12.2333 4.7698C12.9073 4.96847 13.1716 5.78194 12.7431 6.3388L10.9966 8.60874C10.8563 8.79104 10.7832 9.01612 10.7895 9.24604L10.8683 12.1091C10.8876 12.8114 10.1956 13.3142 9.5336 13.0788L6.83505 12.1191C6.61833 12.0421 6.38167 12.0421 6.16495 12.1191L3.4664 13.0788C2.80439 13.3142 2.11241 12.8114 2.13173 12.1091L2.21047 9.24604C2.21679 9.01612 2.14366 8.79104 2.0034 8.60874L0.256856 6.3388C-0.171606 5.78194 0.0927045 4.96847 0.766654 4.7698L3.51388 3.95997C3.7345 3.89493 3.92596 3.75583 4.05599 3.5661L5.67513 1.20359Z" fill="url(#sg)"/></svg>
                  <span class="text-xl font-bold bg-gradient-to-r from-[#FFDA6E] to-[#FFC414] bg-clip-text text-transparent">${rating ? rating.toFixed(1) : '—'}</span>
                </div>
                <div class="text-xs text-white/60 mt-1">Rating</div>
              </div>
              <div class="w-px bg-white/10"></div>
              <div>
                <div class="flex items-center justify-center gap-1.5">
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none"><defs><linearGradient id="cg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#48C855"/><stop offset="100%" stop-color="#C6FFAB"/></linearGradient></defs><path d="M19 2H6c-1.206 0-3 .799-3 3v14c0 2.201 1.794 3 3 3h15v-2H6.012C5.55 19.988 5 19.806 5 19s.55-.988 1.012-1H21V4c0-1.103-.897-2-2-2z" fill="url(#cg)"/></svg>
                  <span class="text-xl font-bold bg-gradient-to-b from-[#48C855] to-[#C6FFAB] bg-clip-text text-transparent">${chTotal}</span>
                </div>
                <div class="text-xs text-white/60 mt-1">Chapters</div>
              </div>
              <div class="w-px bg-white/10"></div>
              <div>
                <div class="flex items-center justify-center gap-1.5">
                  <svg class="w-5 h-5" viewBox="0 0 17 22" fill="none"><defs><linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#4857FF"/><stop offset="100%" stop-color="#707CFE"/></linearGradient></defs><path d="M14.9526 0.615234C16.0258 0.615234 16.9039 1.40517 16.9039 2.37065V18.9066C16.9039 20.0301 16.5332 20.8727 15.8892 21.2062C15.2258 21.5573 14.172 21.3818 13.0012 20.7498L10.4254 18.2092C9.16354 16.7691 8.05777 16.7691 6.79589 18.2092L4.2201 20.7498C3.04928 21.3818 1.99555 21.5398 1.33209 21.2062C0.688142 20.8727 0.317383 20.0301 0.317383 18.9066V2.37065C0.317383 1.40517 1.19549 0.615234 2.26874 0.615234H14.9526Z" fill="url(#bg2)"/></svg>
                  <span class="text-xl font-bold bg-gradient-to-b from-[#4857FF] to-[#707CFE] bg-clip-text text-transparent">${bookmarks ? fmtNum(bookmarks) : '—'}</span>
                </div>
                <div class="text-xs text-white/60 mt-1">Bookmarks</div>
              </div>
            </div>
            <!-- Status + Type -->
            <div class="flex gap-3 pt-4 border-t border-white/10">
              <div class="flex-1 bg-[#1C1924] rounded px-4 py-3">
                <div class="text-xs text-white/50 mb-1">Status</div>
                <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#A78BFA]"></span><span class="text-base font-bold text-[#A78BFA] capitalize">${hd(statusLow)}</span></div>
              </div>
              <div class="flex-1 bg-[#1C1924] rounded px-4 py-3">
                <div class="text-xs text-white/50 mb-1">Type</div>
                <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#913FE2]"></span><span class="text-base font-bold text-[#913FE2] uppercase">${hd(typeLow)}</span></div>
              </div>
            </div>
            <!-- Author / Artist -->
            <div class="flex flex-col gap-2 pt-4 border-t border-white/10 mt-4">
              ${comic.author ? `<div class="flex items-center justify-between bg-[#1C1924] rounded px-4 py-2.5"><div class="flex items-center gap-2"><svg class="w-4 h-4 text-white/70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg><span class="text-xs text-white/50">Author</span></div><span class="text-sm font-medium">${hd(comic.author)}</span></div>` : ''}
              ${comic.illustrator ? `<div class="flex items-center justify-between bg-[#1C1924] rounded px-4 py-2.5"><div class="flex items-center gap-2"><svg class="w-4 h-4 text-white/70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg><span class="text-xs text-white/50">Artist</span></div><span class="text-sm font-medium">${hd(comic.illustrator)}</span></div>` : ''}
            </div>
          </div>
        </div>

        <!-- Genres (desktop) -->
        ${genres.length ? `<div class="hidden lg:flex max-w-full gap-2 flex-wrap">${genres.map(g=>`<a href="/browse?genres=${encodeURIComponent(g.toLowerCase())}" class="inline-flex flex-shrink-0 text-xs font-medium px-3 py-1.5 bg-white/5 rounded-lg border border-white/10 hover:border-[#913FE2] hover:text-[#913FE2] transition-all">${hd(g)}</a>`).join('')}</div>` : ''}
      </div>

      <!-- RIGHT COLUMN -->
      <div class="w-full mt-3 lg:mt-0">
        <article class="bg-[#1C1924] rounded-lg px-3 py-4 lg:p-8">
          <h1 class="text-xl lg:text-[32px] font-semibold leading-tight">${hd(comic.title)}</h1>
          ${comic.alternateNames ? `<div class="flex items-start gap-3 mt-3 text-xs"><p class="text-white/50 leading-relaxed line-clamp-1">${hd(comic.alternateNames)}</p></div>` : ''}
          ${comic.description ? `<div class="mt-3 relative"><div id="desc-text" class="text-sm lg:text-base font-light text-white/80 leading-relaxed prose prose-invert max-w-full line-clamp-3"><p>${hd(comic.description.replace(/<[^>]+>/g,''))}</p></div><div class="flex justify-end mt-2"><button id="desc-btn" class="flex items-center gap-1 text-[#913FE2] text-xs font-medium px-2 py-1 rounded hover:bg-white/5 cursor-pointer transition-colors"><span id="desc-lbl">Show more</span><svg id="desc-ico" class="w-3 h-3 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg></button></div></div>` : ''}

          <!-- Mobile stats -->
          <div class="lg:hidden mt-4 bg-white/5 rounded-lg p-3">
            <div class="flex justify-around text-center">
              <div><div class="flex items-center justify-center gap-1"><svg class="w-4 h-4" viewBox="0 0 13 14" fill="none"><path d="M5.67513 1.20359C6.07233 0.624015 6.92766 0.624014 7.32487 1.20359L8.94401 3.5661C9.07404 3.75583 9.2655 3.89493 9.48612 3.95997L12.2333 4.7698C12.9073 4.96847 13.1716 5.78194 12.7431 6.3388L10.9966 8.60874C10.8563 8.79104 10.7832 9.01612 10.7895 9.24604L10.8683 12.1091C10.8876 12.8114 10.1956 13.3142 9.5336 13.0788L6.83505 12.1191C6.61833 12.0421 6.38167 12.0421 6.16495 12.1191L3.4664 13.0788C2.80439 13.3142 2.11241 12.8114 2.13173 12.1091L2.21047 9.24604C2.21679 9.01612 2.14366 8.79104 2.0034 8.60874L0.256856 6.3388C-0.171606 5.78194 0.0927045 4.96847 0.766654 4.7698L3.51388 3.95997C3.7345 3.89493 3.92596 3.75583 4.05599 3.5661L5.67513 1.20359Z" fill="#FFDA6E"/></svg><span class="font-bold text-[#FFDA6E]">${rating ? rating.toFixed(1) : '—'}</span></div><div class="text-[10px] text-white/60 mt-0.5">Rating</div></div>
              <div class="w-px bg-white/10"></div>
              <div><div class="font-bold text-[#48C855]">${chTotal}</div><div class="text-[10px] text-white/60">Chapters</div></div>
              <div class="w-px bg-white/10"></div>
              <div><div class="font-bold text-[#4857FF]">${bookmarks ? fmtNum(bookmarks) : '—'}</div><div class="text-[10px] text-white/60">Bookmarks</div></div>
            </div>
          </div>
        </article>

        <!-- Action Buttons (mobile) -->
        <div class="mt-3 lg:hidden">
          <div class="mb-2"><button type="button" class="flex h-full w-full items-center justify-center gap-2 rounded-md px-4 py-3 text-sm font-medium bg-gradient-to-r from-[#913FE2] to-[#7c35c2] text-white"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg><span>Bookmark</span></button></div>
          <div class="grid grid-cols-2 gap-2 text-sm font-semibold">
            ${firstCh ? `<a href="${chUrl(slug, firstCh.number)}" class="py-3 rounded-md bg-[#E8E8E8] hover:bg-[#D4D4D4] text-black flex items-center justify-center gap-2 transition-colors"><span>First Chapter</span></a>` : ''}
            ${latestCh ? `<a href="${chUrl(slug, latestCh.number)}" class="py-3 rounded-md bg-[#2b2931] hover:bg-[#3a3842] text-white border border-white/20 flex items-center justify-center gap-2 transition-colors"><span>Latest Chapter</span></a>` : ''}
          </div>
        </div>

        <!-- Action Buttons (desktop) -->
        <div class="hidden lg:grid grid-cols-3 gap-3 mt-4 h-12 font-semibold">
          <button type="button" class="flex h-full w-full items-center justify-center gap-2 rounded-md px-4 py-3 text-sm font-medium bg-gradient-to-r from-[#913FE2] to-[#7c35c2] text-white"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg><span>Bookmark</span></button>
          ${firstCh ? `<a href="${chUrl(slug, firstCh.number)}" class="h-full w-full rounded-md bg-[#E8E8E8] hover:bg-[#D4D4D4] text-black flex items-center justify-center gap-2 transition-colors"><span>First Chapter</span></a>` : '<div></div>'}
          ${latestCh ? `<a href="${chUrl(slug, latestCh.number)}" class="h-full w-full rounded-md bg-[#2b2931] hover:bg-[#3a3842] text-white border border-white/20 flex items-center justify-center gap-2 transition-colors"><span>Latest Chapter</span></a>` : '<div></div>'}
        </div>

        <!-- Chapter List -->
        <div class="mt-4">
          <div class="bg-[#1C1924] rounded-lg overflow-hidden">
            <div class="p-4 border-b border-white/10">
              <div class="flex items-center justify-between mb-3"><h2 class="text-lg font-bold">${chTotal} Chapters</h2></div>
              <div class="relative"><input type="text" id="ch-search" placeholder="Search chapters..." class="w-full bg-[#13111A] text-white placeholder-white/40 rounded-lg px-4 py-2.5 pr-10 outline-none focus:ring-2 focus:ring-[#913FE2]/50 text-sm ring-1 ring-white/20"><svg class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-white/40" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></div>
            </div>
            <div class="max-h-[500px] overflow-y-auto" id="ch-list">
              ${chapters.length === 0 ? '<div class="px-6 py-10 text-center text-white/50">No chapters available yet.</div>' :
              `<div class="divide-y divide-white/5" id="ch-rows">${chapters.map(ch=>`
                <a href="${chUrl(slug, ch.number)}" class="group flex items-center justify-between px-4 py-4 transition-colors hover:bg-white/5" data-ch="${ch.number}">
                  <div class="flex items-center gap-3 min-w-0 flex-1">
                    <div class="min-w-0 flex-1">
                      <div class="flex items-center gap-2"><span class="font-medium transition-colors text-white group-hover:text-[#913FE2]">Chapter ${ch.number}</span></div>
                      ${ch.title ? `<span class="block truncate text-white/50 text-sm mt-0.5">${hd(ch.title)}</span>` : ''}
                    </div>
                  </div>
                  <div class="flex-shrink-0 ml-3 text-right"><span class="text-sm text-white/40">${hd(ch.date || '')}</span></div>
                </a>`).join('')}</div>`}
            </div>
          </div>
        </div>

        <!-- Genres (mobile) -->
        ${genres.length ? `<div class="lg:hidden flex flex-wrap gap-2 mt-4">${genres.map(g=>`<a href="/browse?genres=${encodeURIComponent(g.toLowerCase())}" class="inline-flex text-xs font-medium px-3 py-1.5 bg-white/5 rounded-lg border border-white/10 hover:border-[#913FE2] hover:text-[#913FE2] transition-all">${hd(g)}</a>`).join('')}</div>` : ''}

      </div><!-- /right column -->
    </div>
  </div>
</div>`;

  // Description expand
  const btn = document.getElementById('desc-btn');
  const txt = document.getElementById('desc-text');
  const lbl = document.getElementById('desc-lbl');
  const ico = document.getElementById('desc-ico');
  let exp = false;
  if (btn && txt) {
    btn.addEventListener('click', () => {
      exp = !exp;
      txt.classList.toggle('line-clamp-3', !exp);
      if (lbl) lbl.textContent = exp ? 'Show less' : 'Show more';
      if (ico) ico.style.transform = exp ? 'rotate(180deg)' : '';
    });
  }

  // Chapter search
  const si = document.getElementById('ch-search');
  if (si) {
    si.addEventListener('input', () => {
      const q = si.value.toLowerCase().trim();
      document.querySelectorAll('#ch-rows a').forEach(r => {
        r.style.display = (!q || ('chapter ' + r.dataset.ch).includes(q)) ? '' : 'none';
      });
    });
  }
}

// R2 CDN ga cover rasmlarini yo'naltirish
function fixImages() {
  if (!CDN) return;
  document.querySelectorAll('img').forEach(img => {
    const s = img.getAttribute('src') || '';
    if (s.startsWith('/public/') || s.startsWith('/uploads/')) {
      img.setAttribute('src', CDN + s);
    }
  });
}

// Ishga tushirish
await loadNavFooter();
await loadComic();
fixImages();
</script>
